<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Spanning</title>
<style>
/* dueta.ai's own palette (BAZE), under the names this page already uses. Its
   dark ground is the default here; light is the same names, opt-in. */
:root {
  color-scheme: dark;
  --bg: #141210; --panel: #1d1a16; --fg: #f5ecdd; --dim: rgba(245,236,221,.62); --line: rgba(245,236,221,.14);
  --mint: #f07b5e; --mint-soft: rgba(240,123,94,.12); --blue: #4fa3ce; --blue-soft: rgba(79,163,206,.12);
  --coral: #ff7b75; --ok: #3ddc97; --ink: #2a2620;
  --r: 12px; --slow: 280ms; --expo: cubic-bezier(.16, 1, .3, 1);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #fdfcf9; --panel: #ffffff; --fg: #2a2620; --dim: #554d40; --line: rgba(42,38,32,.14);
  --mint: #bf3c1c; --mint-soft: rgba(191,60,28,.1); --blue: #2c6690; --blue-soft: rgba(44,102,144,.1);
  --coral: #b32a24; --ok: #0b5d3c; --ink: #f7f0e4;
}
@media (prefers-reduced-motion: reduce) { :root { --slow: 0ms; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* .bar / .meters set display and would win */
body {
  margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh;
  font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; align-items: center; padding: 56px 22px 90px;
}
header { width: min(880px, 100%); display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
h1 { font-size: clamp(30px, 4.4vw, 44px); font-weight: 700; margin: 0; letter-spacing: -0.03em; line-height: 1.02; }
.tag { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--mint); }

.bar {
  width: min(880px, 100%); display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; border-radius: var(--r);
}
button {
  font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
  transition: background .15s, border-color .15s, opacity .15s;
}
button:hover:not([disabled]) { border-color: var(--fg); }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
button.primary { background: var(--mint); border-color: var(--mint); color: var(--ink); }
button.primary:hover:not([disabled]) { filter: brightness(1.08); }
button[disabled] { opacity: .4; cursor: default; }
.status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.dot.live { background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
.dot.busy { background: var(--coral); animation: pulse .9s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

.meters { width: min(880px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; order: 2; }
#rec { order: 3; }
.card {
  background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; border-radius: var(--r);
}
.card h2 {
  font-size: 11.5px; font-weight: 600; margin: 0 0 9px; color: var(--dim);
  text-transform: uppercase; letter-spacing: .1em;
}
canvas { width: 100%; height: 28px; display: block; }

@media (max-width: 780px) { .meters { grid-template-columns: 1fr; } }
/* THE CONVERSATION. One bubble per turn, the agent on the left and you on the
   right, in the order the words were said. Full duplex is drawn by letting the
   agent's bubble keep growing while yours is open, never by interleaving. */
#thread { width: min(880px, 100%); min-height: 40vh; margin-top: 12px; order: 1;
          display: flex; flex-direction: column; gap: 12px; }
.bubble { max-width: 86%; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r);
          background: var(--panel); font-size: 15.5px; line-height: 1.65; overflow-wrap: anywhere;
          animation: rise var(--slow) var(--expo) both; }
.bubble[data-who="agent"] { align-self: flex-start; border-bottom-left-radius: 4px; }
.bubble[data-who="user"] { align-self: flex-end; border-bottom-right-radius: 4px;
                           background: var(--blue-soft); border-color: var(--blue); }
.bubble[data-live="1"][data-who="agent"] { border-color: var(--mint); }
.bubble[data-overlap="1"] { box-shadow: inset 2px 0 0 var(--mint); }   /* both talking at once */
.cursor { display: inline-block; width: 7px; height: 1.05em; vertical-align: -2px;
          background: var(--mint); animation: pulse 1.1s steps(2) infinite; }
.bubble[data-who="user"] .cursor { background: var(--blue); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* Setup finishes before the conversation starts: the fields and the voice are
   decided first, Start talking swaps them for the conversation. */
body.talking .who, body.talking #clone { display: none; }
body:not(.talking) #thread, body:not(.talking) .meters { display: none; }
.notice {
  width: min(880px, 100%); margin-top: 12px; border-left: 3px solid var(--coral);
  background: var(--panel); border-radius: 0; padding: 10px 13px;
  color: var(--dim); font-size: 13px; display: none;
}
.notice.show { display: block; }
.who {
  width: min(880px, 100%); margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); order: -1;
  padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end;
}
.who label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--dim);
             text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
.who input {
  font: inherit; font-size: 14px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px;
  background: transparent; color: var(--fg); text-transform: none; letter-spacing: 0; font-weight: 400;
}
.who input:focus { outline: none; border-color: var(--fg); }
.who .persona { grid-column: 1 / -1; }
.who .hint { grid-column: 1 / -1; color: var(--dim); font-size: 12px; margin: -2px 0 0; }
@media (max-width: 780px) { .who { grid-template-columns: 1fr; } }
</style>

<header>
  <span class="tag">Context Spanning</span>
  <h1>Talk. It looks things up mid-sentence.</h1>
</header>

<div class="bar">
  <button id="go" class="primary">Start talking</button>
  <button id="clone">Clone my voice</button>
  <select id="voicesel" title="One of the released voices"><option value="">Voice: default (f0)</option><option value="f1">Voice: f1</option><option value="f2">Voice: f2</option></select>
  <button id="voicefile-btn" type="button" title="A recording of the voice to speak with (any audio file, a few seconds or more)">Use a voice file</button>
  <input type="file" id="voicefile" accept="audio/*" hidden>
  <span class="status"><span class="dot" id="dot"></span><span id="state">idle</span></span>
</div>

<div class="notice" id="notice"></div>
<div class="bar" id="rec" hidden>
  <a id="recwav" download>Download recording (wav: left = you, right = agent)</a>
  <a id="recjson" download>Download transcript (json: spans, text, timing)</a>
</div>

<div class="who">
  <label>Your name <input id="name" placeholder="optional" autocomplete="off"></label>
  <label>Where you are <input id="loc" placeholder="city, or use the button" autocomplete="off"></label>
  <button id="geo" type="button" title="Asks the browser once; nothing is sent anywhere but this server">Use my location</button>
  <label class="persona">Agent persona <input id="persona" placeholder="who the agent is"></label>
  <label class="persona">Knowledge (optional) <input id="db" placeholder="a passage the agent may draw on; it goes to the retrieval router, not the model" autocomplete="off"></label>
</div>

<div class="meters">
  <div class="card"><h2>You</h2><canvas id="wu" height="46"></canvas></div>
  <div class="card"><h2>Agent</h2><canvas id="wa" height="46"></canvas></div>
</div>

<div id="thread"></div>

<script>
const $ = (id) => document.getElementById(id);
if (new URLSearchParams(location.search).get("theme") === "light") document.documentElement.dataset.theme = "light";
let ws, ctx, node, stream, mic, playAt = 0, running = false;
let micOn = false, mode = "talk", fmt = null;   // fmt = {sampleRate, frameSize} from the server's `ready`
let queuedVoice = null;                          // {name} or {pcm} to apply once the connection is ready
let geo = null;                          // {lat, lon} once the user allowed it
let rec = null;                          // {user: [Float32Array], agent: [...], events: [], sr}
const now = () => (rec ? (performance.now() - rec.t0) / 1000 : 0);
function recEvent(kind, extra) { if (rec) rec.events.push(Object.assign({ t: +now().toFixed(3), type: kind }, extra || {})); }

// Who is talking. Remembered in this browser only; sent to this server only.
const FIELDS = ["name", "loc", "persona", "db"];
const stored = (f) => { try { return localStorage.getItem("cs." + f); } catch (e) { return null; } };
for (const f of FIELDS) { const v = stored(f); if (v !== null) $(f).value = v; }
let serverPersona = "";                  // the default this server starts from, sent with `ready`
function context() {
  let tz = "";
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
  return { type: "context", name: $("name").value.trim(), location: $("loc").value.trim(),
           lat: geo ? geo.lat : null, lon: geo ? geo.lon : null, tz, persona: $("persona").value.trim(),
           db: $("db").value.trim() };
}
function sendContext() {
  for (const f of FIELDS) {
    // A persona equal to the server's default is not remembered, so a later release changing that
    // default reaches everyone. Only an edit — including emptying the field — is a stored choice.
    const keep = f !== "persona" || $(f).value !== serverPersona;
    try { keep ? localStorage.setItem("cs." + f, $(f).value) : localStorage.removeItem("cs." + f); }
    catch (e) {}
  }
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(context()));
}
for (const f of FIELDS) $(f).addEventListener("change", sendContext);
$("geo").onclick = () => {
  if (!navigator.geolocation) { notice("This browser has no geolocation."); return; }
  $("geo").disabled = true; $("geo").textContent = "Locating";
  navigator.geolocation.getCurrentPosition((p) => {
    geo = { lat: p.coords.latitude, lon: p.coords.longitude };
    $("geo").textContent = `${geo.lat.toFixed(2)}, ${geo.lon.toFixed(2)}`; $("geo").disabled = false;
    sendContext();
  }, (err) => {
    // Refused or unavailable: fine, the typed location (if any) still counts.
    geo = null; $("geo").textContent = "Use my location"; $("geo").disabled = false;
    notice("Location not shared (" + err.message + "). Type a place instead, or leave it empty.");
  }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
};
let cloning = false, clip = [];
const lvl = { u: new Array(110).fill(0), a: new Array(110).fill(0) };

function status(text, kind) {
  $("state").textContent = text;
  $("dot").className = "dot" + (kind ? " " + kind : "");
}
function notice(text) {
  $("notice").textContent = text || "";
  $("notice").classList.toggle("show", !!text);
}
function rms(f) { let s = 0; for (let i = 0; i < f.length; i++) s += f[i] * f[i]; return Math.sqrt(s / f.length); }
function push(which, v) { lvl[which].push(v); lvl[which].shift(); }

// Both meters are drawn on the animation frame rather than per audio frame, so a slow tab loses
// pixels instead of losing audio.
function draw(id, arr, color) {
  const c = $(id), w = c.clientWidth, h = 46, dpr = devicePixelRatio || 1;
  if (!w) return;
  if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const bw = w / arr.length;
  g.fillStyle = color;
  for (let i = 0; i < arr.length; i++) {
    const v = Math.min(1, arr[i] * 7), bh = Math.max(2, v * (h - 8));
    g.globalAlpha = 0.22 + 0.78 * v;
    g.fillRect(i * bw, (h - bh) / 2, Math.max(1, bw - 1.5), bh);
  }
  g.globalAlpha = 1;
}
(function tick() {
  const cs = getComputedStyle(document.documentElement);
  draw("wu", lvl.u, cs.getPropertyValue("--blue").trim());
  draw("wa", lvl.a, cs.getPropertyValue("--mint").trim());
  requestAnimationFrame(tick);
})();

async function start() {
  if (!window.isSecureContext) {
    notice("Browsers allow microphone access only over https or on localhost. Reach this page that way and reload.");
    return;
  }
  notice("");
  mode = "talk";
  $("go").disabled = true; $("clone").disabled = true; status("connecting", "busy");
  if (ws && ws.readyState === WebSocket.OPEN && fmt) {   // the connection the voice was cloned on
    sendContext(); openMic(fmt.sampleRate, fmt.frameSize);
    return;
  }
  connect();
}

function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  // The page's own query string rides along, so `?token=...` reaches the server's --token check.
  ws = new WebSocket(`${scheme}://${location.host}/ws${location.search}`);
  ws.binaryType = "arraybuffer";

  ws.onmessage = (ev) => {
    if (typeof ev.data !== "string") {
      const pcm = new Float32Array(ev.data);
      if (rec) rec.agent.push(pcm);
      push("a", rms(pcm));
      play(pcm);
      return;
    }
    const m = JSON.parse(ev.data);
    // Context first, then the microphone: the persona has to land before the first frame. The
    // server's default persona is shown rather than assumed, so emptying the field is a choice.
    if (m.type === "ready") {
      serverPersona = m.persona || "";
      if (stored("persona") === null) $("persona").value = serverPersona;
      fmt = { sampleRate: m.sample_rate, frameSize: m.frame_size };
      if (mode === "clone") { openMic(fmt.sampleRate, fmt.frameSize, true); }
      else if (mode === "voice") { applyVoice(); }
      else { sendContext(); openMic(fmt.sampleRate, fmt.frameSize); }
    }
    else if (m.type === "busy") {
      notice("Another conversation is already running on this server.");
      status("busy", "busy"); $("go").disabled = false;
    }
    else if (m.type === "text") { recEvent("text", { delta: m.delta }); appendText(m.delta); }
    else if (m.type === "ret") { recEvent("ret"); status("retrieving", "busy"); }
    else if (m.type === "user_text") { recEvent("user_text", { utt: m.utt, final: m.final, t: m.t, text: m.text }); showYou(m); }
    else if (m.type === "question") { recEvent("question", { text: m.text, ms: m.ms }); markRouted(m.text); }
    // A span, a dropped span and a turn that needed none are all recorded and
    // none of them is drawn: the screen is the conversation, they are the JSON.
    else if (m.type === "late") { recEvent("late", { question: m.question, seconds: m.seconds, source: m.source }); status("listening", "live"); }
    else if (m.type === "no_span") { recEvent("no_span", { question: m.question }); status("listening", "live"); }
    else if (m.type === "span") { recEvent("span", { text: m.text, question: m.question, source: m.source, frames: m.frames, seconds: m.seconds }); notice(""); status("listening", "live"); }
    else if (m.type === "error") { recEvent("error", { stage: m.stage, message: m.message }); notice(`${m.stage}: ${m.message}`); status("listening", "live"); }
    else if (m.type === "cloned") {
      cloning = false;
      closeMic();                                   // the connection stays open, the voice on it
      status(`voice cloned from ${m.seconds}s`, null);
      $("clone").textContent = "Voice cloned (record again)"; $("clone").disabled = false;
      $("voicefile-btn").disabled = false; $("go").disabled = false;
    }
    else if (m.type === "voice") {
      status(`voice ${m.name || "f0"} ready — press Start talking`, null);
      $("go").disabled = false; $("clone").disabled = false; $("voicefile-btn").disabled = false;
    }
  };
  ws.onclose = (e) => stop(e.wasClean ? "idle" : "connection closed");
  ws.onerror = () => notice("Could not reach the server. Check that it is running on this host and port.");
}

// The turn boundaries were already on the wire: a `question` opens a user turn
// and the agent's text resumes after it. So this is a renderer, not new plumbing.
const turns = [], youBubbles = {};
let agentBubble = null;
function bubble(who, utt) {
  const d = document.createElement("div");
  d.className = "bubble"; d.dataset.who = who; d.dataset.live = "1";
  const cur = document.createElement("span"); cur.className = "cursor";
  d.append(document.createElement("span"), cur);
  d._rec = { speaker: who, text: "", t: +now().toFixed(3) };
  turns.push(d._rec); $("thread").append(d);
  if (utt !== undefined) youBubbles[utt] = d;
  return d;
}
function fill(b, text) { b._rec.text = text; b.firstChild.textContent = text; b.scrollIntoView({ block: "end" }); }
function seal(b) { if (b) { b.dataset.live = "0"; const c = b.querySelector(".cursor"); if (c) c.remove(); } }
const youOpen = () => Object.values(youBubbles).some((b) => b.dataset.live === "1");

function appendText(delta) {
  // The agent's bubble keeps growing while your bubble is open — that overlap IS
  // full duplex, and it is drawn instead of splicing your line through his.
  if (!agentBubble) agentBubble = bubble("agent");
  if (youOpen()) agentBubble.dataset.overlap = "1";
  fill(agentBubble, agentBubble._rec.text + delta);
}
function showYou(m) {
  const b = youBubbles[m.utt] || bubble("user", m.utt);
  fill(b, m.text);
  // Your utterance ending closes his bubble, so the reply starts a new one.
  if (m.final) { seal(b); seal(agentBubble); agentBubble = null; }
}
function markRouted(text) {
  // What the ASR heard. Usually it is already a bubble; if it only reached the
  // page through the retrieval path, draw it rather than lose your sentence.
  if (Object.values(youBubbles).some((b) => b._rec.text === text)) return;
  const b = bubble("user"); fill(b, text); seal(b); seal(agentBubble); agentBubble = null;
}

async function openMic(sampleRate, frameSize, forClone = false) {
  try {
    ctx = new AudioContext({ sampleRate });
    const raw = new URLSearchParams(location.search).get("raw") === "1";
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: !raw, autoGainControl: false,
               channelCount: 1 } });
    if (raw) notice("Raw microphone: the browser's noise suppression is off.");
    await ctx.audioWorklet.addModule("/static/mic.js");
  } catch (e) {
    notice("Microphone unavailable: " + (e && e.message ? e.message : e));
    stop("idle");
    return;
  }
  const src = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, "mic-frames", { processorOptions: { frameSize } });
  node.port.onmessage = (e) => frame(new Float32Array(e.data));
  src.connect(node);
  micOn = true;
  begin(sampleRate, forClone);
}

function frame(f) {
  if (!micOn) return;
  push("u", rms(f));
  if (cloning) clip.push(f); else if (running) { if (rec) rec.user.push(f); ws.send(f.buffer); }
}

// Setup is over: the fields, the persona and the voice are already on the
// connection, and from here the page is the conversation.
function begin(sampleRate, forClone) {
  if (forClone) { recordVoice(); return; }
  rec = { user: [], agent: [], events: [], sr: sampleRate, t0: performance.now(),
          context: context() };
  $("rec").hidden = true;
  $("thread").textContent = ""; turns.length = 0; agentBubble = null;
  for (const k of Object.keys(youBubbles)) delete youBubbles[k];
  document.body.classList.add("talking");
  running = true; playAt = ctx ? ctx.currentTime + 0.1 : 0;
  status("listening", "live");
  $("go").textContent = "Stop"; $("go").disabled = false;
  $("go").onclick = () => stop("idle");
}

function closeMic() {
  micOn = false;
  if (mic) mic.stop();
  if (stream) stream.getTracks().forEach((t) => t.stop());
  if (node) node.disconnect();
  if (ctx) { try { ctx.close(); } catch (e) {} }
  mic = stream = node = ctx = null;
}

async function recordVoice() {
  // 12 s of the user's speech; the model conditions on timbre, not on the words.
  cloning = true; clip = [];
  for (let left = 12; left > 0; left--) {
    $("clone").textContent = `Recording ${left}s`;
    status("read a sentence or two out loud", "busy");
    await new Promise((r) => setTimeout(r, 1000));
  }
  const total = clip.reduce((n, f) => n + f.length, 0);
  const pcm = new Float32Array(total);
  let o = 0; for (const f of clip) { pcm.set(f, o); o += f.length; }
  clip = [];
  $("clone").textContent = "Encoding";
  status("encoding voice", "busy");
  ws.send(JSON.stringify({ type: "clone" }));
  ws.send(pcm.buffer);
}

function play(pcm) {
  if (!ctx || pcm.length === 0) return;
  const buf = ctx.createBuffer(1, pcm.length, ctx.sampleRate);
  buf.getChannelData(0).set(pcm);
  const s = ctx.createBufferSource();
  s.buffer = buf; s.connect(ctx.destination);
  playAt = Math.max(playAt, ctx.currentTime + 0.02);   // keep the queue just ahead of the clock
  s.start(playAt);
  playAt += buf.duration;
}

function wav16(left, right, sr) {
  // Two-channel 16-bit PCM. Left = what the microphone sent, right = what the agent said, on the
  // same frame clock, so the timing of a span against the speech can be read off the waveform.
  const n = Math.max(left.length, right.length), bytes = 44 + n * 4, b = new DataView(new ArrayBuffer(bytes));
  const str = (o, t) => { for (let i = 0; i < t.length; i++) b.setUint8(o + i, t.charCodeAt(i)); };
  str(0, "RIFF"); b.setUint32(4, bytes - 8, true); str(8, "WAVE"); str(12, "fmt "); b.setUint32(16, 16, true);
  b.setUint16(20, 1, true); b.setUint16(22, 2, true); b.setUint32(24, sr, true); b.setUint32(28, sr * 4, true);
  b.setUint16(32, 4, true); b.setUint16(34, 16, true); str(36, "data"); b.setUint32(40, n * 4, true);
  const s16 = (x) => Math.max(-32768, Math.min(32767, Math.round((x || 0) * 32767)));
  for (let i = 0, o = 44; i < n; i++, o += 4) { b.setInt16(o, s16(left[i]), true); b.setInt16(o + 2, s16(right[i]), true); }
  return new Blob([b.buffer], { type: "audio/wav" });
}
function concat(chunks) {
  const total = chunks.reduce((k, f) => k + f.length, 0), out = new Float32Array(total);
  let o = 0; for (const f of chunks) { out.set(f, o); o += f.length; }
  return out;
}
function offerRecording() {
  if (!rec || (!rec.user.length && !rec.agent.length)) return;
  const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
  const wav = wav16(concat(rec.user), concat(rec.agent), rec.sr);
  const transcript = { recorded_at: new Date().toISOString(), sample_rate: rec.sr,
                       seconds: +(Math.max(rec.user.length, rec.agent.length) * (rec.user[0] || rec.agent[0]).length / rec.sr).toFixed(2),
                       context: rec.context, events: rec.events, turns,
                       agent_text: turns.filter((t) => t.speaker === "agent").map((t) => t.text).join(" ") };
  const js = new Blob([JSON.stringify(transcript, null, 1)], { type: "application/json" });
  for (const [id, blob, name] of [["recwav", wav, `contextspanning-${stamp}.wav`], ["recjson", js, `contextspanning-${stamp}.json`]]) {
    const a = $(id); if (a.href) URL.revokeObjectURL(a.href);
    a.href = URL.createObjectURL(blob); a.download = name;
  }
  $("rec").hidden = false;
}

function stop(msg) {
  running = false;
  seal(agentBubble); agentBubble = null;
  document.body.classList.remove("talking");
  try { offerRecording(); } catch (e) { console.warn("recording", e); }
  closeMic();
  if (ws && ws.readyState === WebSocket.OPEN) ws.close();
  fmt = null;
  lvl.u.fill(0); lvl.a.fill(0);
  status(msg, null);
  $("go").textContent = "Start talking"; $("go").disabled = false;
  $("go").onclick = start;
  $("clone").textContent = "Clone my voice"; $("clone").disabled = false; $("voicefile-btn").disabled = false;
}

// A voice chosen before the conversation: one of the released voices by name, or any audio file, which is
// decoded in the browser to the engine's sample rate and sent down the same path as a microphone clone.
function applyVoice() {
  const v = queuedVoice; queuedVoice = null;
  if (!v || !ws || ws.readyState !== WebSocket.OPEN) return;
  if (v.name !== undefined) ws.send(JSON.stringify({ type: "voice", name: v.name }));
  else { ws.send(JSON.stringify({ type: "clone" })); ws.send(v.pcm.buffer); }
}
function chooseVoice(v) {
  if (running) { notice("Stop the conversation first; the next one starts in the chosen voice."); return; }
  notice(""); queuedVoice = v; mode = "voice";
  $("go").disabled = true; $("clone").disabled = true; $("voicefile-btn").disabled = true; status("setting the voice", "busy");
  if (ws && ws.readyState === WebSocket.OPEN && fmt) applyVoice(); else connect();
}
$("voicesel").onchange = () => chooseVoice({ name: $("voicesel").value || "f0" });
$("voicefile-btn").onclick = () => $("voicefile").click();
$("voicefile").onchange = async () => {
  const f = $("voicefile").files[0]; if (!f) return;
  try {
    const sr = (fmt && fmt.sampleRate) || 24000;
    const ac = new OfflineAudioContext(1, 1, sr);
    const buf = await ac.decodeAudioData(await f.arrayBuffer());   // decoded and resampled to `sr`, mixed to mono below
    const n = buf.length, pcm = new Float32Array(n);
    for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) pcm[i] += d[i] / buf.numberOfChannels; }
    if (n < sr * 2) { notice("That file is shorter than 2 seconds; a few seconds of speech are needed."); return; }
    chooseVoice({ pcm: pcm.subarray(0, Math.min(n, sr * 30)) });
  } catch (e) { notice("Could not decode that file: " + (e && e.message ? e.message : e)); }
  $("voicefile").value = "";
};

$("clone").onclick = () => {
  // Cloning happens before the conversation: the voice is set on the connection, then Start talks with it.
  if (running) { notice("Stop the conversation first, then clone; the next conversation starts in that voice."); return; }
  if (!window.isSecureContext) { notice("Browsers allow microphone access only over https or on localhost."); return; }
  notice("");
  mode = "clone";
  $("clone").disabled = true; $("go").disabled = true; status("connecting", "busy");
  if (ws && ws.readyState === WebSocket.OPEN && fmt) { openMic(fmt.sampleRate, fmt.frameSize, true); return; }
  connect();
};

$("go").onclick = start;
</script>
