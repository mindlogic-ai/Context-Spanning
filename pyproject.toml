[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "contextspan"
version = "1.0.0"
description = "Context Spanning: a communication framework for full-duplex speech models and external LLM backends"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.2", "numpy", "soundfile", "librosa", "requests", "sentencepiece", "huggingface_hub", "aiohttp",
  "safetensors", "einops", "sphn",
  "mcp", "beautifulsoup4",
]

[project.optional-dependencies]
browser = ["playwright"]          # the 32 browser tools of the bank; run `playwright install chromium`
asr-server = ["qwen-asr"]         # python -m contextspan.duetaspan.runtime.asr_server (Qwen3-ASR)

[tool.setuptools.packages.find]
include = ["contextspan*"]

[tool.setuptools.package-data]
contextspan = ["web/*", "moshi/LICENSE.*", "datasets/moshicp/mcp_tool_bank.json", "datasets/moshicp/*.sqlite"]
